# Production stack for one server (Milestone 6). Separate from the development compose.yaml.
#
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env.production up -d --build
#   (public demo: add --profile demo, with DEMO_MODE=true and POSTGRES_DB=incidents_demo)
#
# Start-up order: db (healthy) -> migrate (alembic upgrade head and the runtime role, as the owner;
# must succeed) -> backend (ready: schema matches the code and the role is least-privilege) and
# worker -> web (Caddy). A failed migration stops the deploy, and the backend reports 503 on
# /health/ready whenever the schema and the code disagree.
#
# Two database roles: POSTGRES_USER owns the schema and runs migrations only; the API and the worker
# connect as APP_DB_USER, which can read and add audit records but never change, remove or unprotect them.
#
# Operations (Phase D, docs/OPERATIONS.md): JSON logs with request IDs, rotated by Docker; health
# checks for the backend (ready), worker, demo reset and backups (`docker compose ps`); a daily backup
# of POSTGRES_DB into the backups volume.
name: imp-prod

# Docker keeps at most 5 x 10 MB of logs per container, so logs cannot fill the server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  image: ${BACKEND_IMAGE:-imp-backend:prod}
  build:
    context: ../backend
    target: prod
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-imp_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-incidents}
    SESSION_COOKIE_SECURE: "true"
    # Only the reverse proxy may supply the client address (fixed address on the internal network).
    FORWARDED_ALLOW_IPS: 172.30.0.10
    # Simulated AI only; the paid provider is refused at start-up in production.
    TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-fake}
    # Public-demo writes per client IP per hour (0 turns a limit off).
    WRITE_LIMIT_INCIDENTS_PER_HOUR: ${WRITE_LIMIT_INCIDENTS_PER_HOUR:-20}
    WRITE_LIMIT_COMMENTS_PER_HOUR: ${WRITE_LIMIT_COMMENTS_PER_HOUR:-60}
    WRITE_LIMIT_TRIAGE_PER_HOUR: ${WRITE_LIMIT_TRIAGE_PER_HOUR:-20}
    # Public demo: published demo accounts with protections and a banner (see app/demo.py).
    DEMO_MODE: ${DEMO_MODE:-false}
    # One JSON object per line, with request IDs; no secrets, tokens or incident text (app/logs.py).
    LOG_FORMAT: json
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - internal

services:
  db:
    # Pinned by digest (amd64 and arm64); see docs/OPERATIONS.md, Updating base images.
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    # The image's own postgres user (uid 70; it owns the data and socket directories), so the entrypoint
    # never runs as root and never executes gosu (.trivyignore.yaml); no Linux capabilities are needed.
    user: postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-incidents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  migrate:
    <<: *backend
    # As the schema owner: apply migrations, then create or update the least-privilege runtime role.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-incidents}
      APP_DB_USER: ${APP_DB_USER:-imp_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      LOG_FORMAT: json
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli db-roles"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    healthcheck:
      # Ready only when the database answers and its schema matches this code.
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "app.cli", "sla-escalate", "--loop", "--interval", "60"]
    restart: unless-stopped
    healthcheck:
      # Unhealthy when the latest run failed (or the database is not ready) or none succeeded for 5 minutes.
      test: ["CMD", "python", "-m", "app.cli", "health-check", "worker", "--max-age", "300"]
      interval: 60s
      timeout: 15s
      start_period: 90s
      retries: 2
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Public demo only (`--profile demo`): seeds a fresh demo database, then resets it every day at
  # 04:00 UTC. Runs as the schema owner, and refuses any database whose name does not end in _demo.
  demo-reset:
    <<: *backend
    profiles: ["demo"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-incidents}
      DEMO_MODE: "true"
      DEMO_DATABASE: ${POSTGRES_DB:-incidents}
      LOG_FORMAT: json
    command: ["python", "-m", "app.cli", "demo-reset", "--daily"]
    restart: unless-stopped
    healthcheck:
      # Unhealthy when the latest reset failed or was refused (kept until the next successful one).
      test: ["CMD", "python", "-m", "app.cli", "health-check", "demo-reset", "--max-age", "90000"]
      interval: 5m
      timeout: 15s
      start_period: 2m
      retries: 1
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Daily backup of POSTGRES_DB (03:30 UTC by default, before the demo reset) into the backups volume:
  # custom-format dumps, 0600, with SHA-256 files; the newest BACKUP_KEEP are kept. Restores go into a
  # new database only (deploy/restore.sh; docs/OPERATIONS.md). Copy dumps off the server regularly.
  backup:
    image: ${BACKUP_IMAGE:-imp-backup:prod}
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-incident}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_DATABASE: ${POSTGRES_DB:-incidents}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-03:30}
    volumes:
      - backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Unhealthy when the latest backup failed or none succeeded for 26 hours.
      test: ["CMD", "backup.sh", "health"]
      interval: 5m
      timeout: 10s
      start_period: 2m
      retries: 1
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  web:
    image: ${WEB_IMAGE:-imp-web:prod}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    networks:
      internal:
        ipv4_address: 172.30.0.10

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backups:
