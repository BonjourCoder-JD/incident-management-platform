# Override for the disposable end-to-end stack. Only ever used with `docker compose -p imp-e2e`
# through e2e/run.sh, so its database volume is imp-e2e_postgres_data, never the development one.
services:
  backend:
    # The browser reaches the API through the frontend's /api proxy, as real users do.
    ports: !reset []
    environment:
      # Small limit so the over-limit export path is exercised with a handful of incidents.
      EXPORT_MAX_ROWS: "5"
      # The deterministic offline provider only. The key is forced empty so a developer's real key can
      # never reach the end-to-end stack, and no test can make a paid call.
      TRIAGE_PROVIDER: "fake"
      ANTHROPIC_API_KEY: ""
  frontend:
    # A different host port, so a running development stack on 5173 is unaffected.
    ports: !override
      - "127.0.0.1:15173:5173"
  sla-worker:
    # Not started: e2e/run.sh runs the escalation command itself, so the tests control when.
    profiles: ["manual"]
