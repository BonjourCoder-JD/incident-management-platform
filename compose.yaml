services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevonly}
      POSTGRES_DB: ${POSTGRES_DB:-incidents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:-localdevonly}@db:5432/${POSTGRES_DB:-incidents}
      # AI triage (Milestone 5C) is off unless set: "fake" (offline test provider) or "anthropic"
      # (paid; also needs ANTHROPIC_API_KEY). See docs/PROJECT_SPEC.md before enabling a real provider.
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-off}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  # Records escalations for overdue SLA targets once a minute (Milestone 5B). Same image as the
  # backend; it holds a database advisory lock, so a second copy would simply skip its runs.
  sla-worker:
    build: ./backend
    command: ["python", "-m", "app.cli", "sla-escalate", "--loop", "--interval", "60"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD:-localdevonly}@db:5432/${POSTGRES_DB:-incidents}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
