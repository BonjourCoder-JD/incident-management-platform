name: Security scans

# Free, open-source scanners (Milestone 6 Phase E): pip-audit and npm audit for dependencies, Trivy for
# the production images. Runs on every change and weekly, so new advisories are found without a commit.
# Gate: HIGH and CRITICAL findings that have a fix. Accepted exceptions: .trivyignore.yaml (expiring).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  POSTGRES_IMAGE: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Python dependencies (pip-audit)
        run: |
          python -m pip install --quiet pip-audit==2.10.1
          pip-audit --strict --require-hashes --disable-pip -r backend/requirements-runtime.lock
          pip-audit --strict -r backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Frontend dependencies (npm audit, from the lockfile)
        working-directory: frontend
        run: npm audit --audit-level=high

  images:
    name: Image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the production images
        run: |
          docker build --target prod --tag imp-backend:scan ./backend
          docker build --file deploy/web.Dockerfile --tag imp-web:scan .
          docker build --file deploy/backup.Dockerfile --tag imp-backup:scan .
          docker pull --quiet "$POSTGRES_IMAGE"
      - name: Scan with Trivy (HIGH and CRITICAL with a fix fail the job)
        run: |
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" -w /repo "$TRIVY_IMAGE" \
              image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore.yaml "$@"
          }
          scan imp-backend:scan
          scan imp-web:scan
          scan imp-backup:scan
          # The database image's gosu findings are accepted by ID for that one file (.trivyignore.yaml, with
          # the reachability assessment); anything else in the image still fails the scan.
          scan "$POSTGRES_IMAGE"
