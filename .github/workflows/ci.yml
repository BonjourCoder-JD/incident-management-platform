name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Disposable database that exists only for this job.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: incidents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident -d incidents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://incident:ci-only-disposable@localhost:5432/incidents_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check models match migrations
        run: alembic check
      - name: Run tests
        run: python -m pytest -v

  migrations:
    name: Migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Separate disposable database so downgrades never affect the test job.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: incidents_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident -d incidents_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://incident:ci-only-disposable@localhost:5432/incidents_migrations
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Confirm schema was removed
        run: |
          python - <<'EOF'
          from sqlalchemy import inspect
          from app.database import engine
          inspector = inspect(engine)
          tables = set(inspector.get_table_names()) - {"alembic_version"}
          enums = [e["name"] for e in inspector.get_enums()]
          assert not tables, f"tables left after downgrade: {tables}"
          assert not enums, f"enum types left after downgrade: {enums}"
          print("downgrade removed all application tables and enum types")
          EOF
      - name: Upgrade to head again
        run: alembic upgrade head
      - name: Check models match migrations
        run: alembic check
      - name: Bootstrap admin command works on the migrated schema
        env:
          # Throwaway value for this job's temporary database only.
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-disposable-passphrase
        run: |
          python -m app.cli create-admin --email ci.admin@example.com
          if python -m app.cli create-admin --email ci.admin@example.com; then
            echo "Duplicate admin creation should have failed" >&2
            exit 1
          fi

  frontend-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check and production build
        run: npm run build

  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build backend image
        run: docker build --tag incident-backend:ci ./backend
      - name: Build frontend image
        run: docker build --tag incident-frontend:ci ./frontend

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Type check the tests
        run: npm run typecheck
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests against a disposable stack
        # run.sh generates and masks per-run passwords, starts the "imp-e2e" Compose project,
        # migrates, bootstraps an admin, runs Playwright and always removes the stack.
        run: bash ./run.sh
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-evidence
          # Screenshots, page snapshots and backend logs only: no traces, reports, auth state or credentials.
          path: |
            e2e/test-results/**/*.png
            e2e/test-results/**/error-context.md
            e2e/test-results/backend.log
          retention-days: 7
          if-no-files-found: ignore
