# Weekly update proposals (Milestone 6 Phase E) for the pinned base-image digests and the GitHub Actions
# commit SHAs. Each arrives as a pull request that must pass CI and the security scans before merging.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/backend", "/deploy"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directories: ["/deploy"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
